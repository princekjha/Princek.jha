<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prince Jha | Portfolio</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    /* Full iframe */
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Floating bottom overlay */
    .bottom-overlay {
      position: fixed;
      bottom: 12px;
      right: 16px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      padding: 10px 18px;
      border-radius: 14px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
      z-index: 9999;
    }
  </style>
</head>
<body>

  <iframe src="https://prince-kumar-jha-hsrjrz9.gamma.site/" title="Portfolio"></iframe>

  <div class="bottom-overlay">
    © 2025 Prince Kumar Jha
  </div>

</body>
</html>
